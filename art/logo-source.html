<!doctype html>
<html><head><meta charset="utf-8"><title>Skill-Up Colors logo (Paint style)</title>
<style>html,body{margin:0;background:#16162a}canvas{display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script>
// Skill-Up Colors logo, drawn like a kid did it in MS Paint.
// Seeded random so every render gives the same picture.
let seed = 478409440; // = seed 7 after the old sun was drawn, so the arrows keep their exact wobble
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function jit(n) { return (rnd() - 0.5) * 2 * n; }

const c = document.getElementById('c');
const g = c.getContext('2d');
g.fillStyle = '#16162a'; g.fillRect(0, 0, 512, 512);  // dark night sky
g.lineCap = 'round'; g.lineJoin = 'round';

// A shaky line through points: each segment is cut into little steps that wander.
function shakyPath(pts, wob, closed) {
  const p = closed ? pts.concat([pts[0]]) : pts;
  g.beginPath();
  g.moveTo(p[0][0] + jit(wob), p[0][1] + jit(wob));
  for (let i = 1; i < p.length; i++) {
    const [ax, ay] = p[i - 1], [bx, by] = p[i];
    const steps = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / 18));
    for (let s = 1; s <= steps; s++) {
      const t = s / steps;
      g.lineTo(ax + (bx - ax) * t + jit(wob), ay + (by - ay) * t + jit(wob));
    }
  }
}
function stroke(pts, color, width, wob, closed) {
  g.strokeStyle = color; g.lineWidth = width;
  shakyPath(pts, wob, closed); g.stroke();
}
// "Paint bucket": fill slightly off from the outline, so it leaks and misses.
function sloppyFill(pts, color, dx, dy) {
  g.fillStyle = color;
  shakyPath(pts.map(([x, y]) => [x + dx, y + dy]), 5, true); g.fill();
}

function arrow(cx, top, bottom, w) {
  const h = w * 0.9, s = w * 0.42;
  return [[cx, top], [cx + w, top + h], [cx + s, top + h], [cx + s, bottom],
          [cx - s, bottom], [cx - s, top + h], [cx - w, top + h]];
}

// Grass along the bottom, scribbled.
sloppyFill([[0,470],[512,462],[512,512],[0,512]], '#00b000', 0, 0);
for (let x = 6; x < 512; x += 16) stroke([[x, 475], [x + 6 + jit(3), 448 + jit(6)]], '#008000', 5, 1);

// The three arrows: green (small), yellow, orange (big), like the skill-up arrows.
const arrows = [
  { pts: arrow(128, 270, 465, 66), fill: '#22cc22', off: [7, 5] },
  { pts: arrow(262, 180, 465, 70), fill: '#ffee00', off: [-6, 6] },
  { pts: arrow(398, 92, 465, 74),  fill: '#ff8020', off: [6, -5] },
];
for (const a of arrows) sloppyFill(a.pts, a.fill, a.off[0], a.off[1]);
for (const a of arrows) stroke(a.pts, '#fff', 7, 4, true);

// A few happy "speed lines" because the arrows are going UP.
stroke([[200,150],[214,118]], '#fff', 5, 1); stroke([[222,158],[240,124]], '#fff', 5, 1);
stroke([[470,180],[490,150]], '#fff', 5, 1); stroke([[478,214],[500,186]], '#fff', 5, 1);

// MS Paint has no smoothing: snap every pixel to the nearest solid color.
const img = g.getImageData(0, 0, 512, 512), d = img.data;
const palette = [[22,22,42],[255,255,255],[0,176,0],[0,128,0],[34,204,34],[255,238,0],[255,128,32]];
for (let i = 0; i < d.length; i += 4) {
  let best = palette[0], bd = 1e9;
  for (const p of palette) {
    const dd = (d[i]-p[0])**2 + (d[i+1]-p[1])**2 + (d[i+2]-p[2])**2;
    if (dd < bd) { bd = dd; best = p; }
  }
  d[i] = best[0]; d[i+1] = best[1]; d[i+2] = best[2]; d[i+3] = 255;
}
g.putImageData(img, 0, 0);
</script></body></html>
